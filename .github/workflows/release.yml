name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 发布单文件版
        shell: pwsh
        run: ./publish.ps1

      - name: 打包
        shell: pwsh
        run: Compress-Archive -Path ./Publish/TaskbarCalendar.exe -DestinationPath ./TaskbarCalendar-win-x64.zip -Force

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: TaskbarCalendar-win-x64
          path: TaskbarCalendar-win-x64.zip

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TaskbarCalendar-win-x64.zip
          generate_release_notes: true
